<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#315bd4">
  <title>CalendarSync 베타</title>
  <link rel="stylesheet" href="/assets/beta.css">
  <script defer src="/assets/beta-calendar.js"></script>
  <script defer src="/assets/beta.js"></script>
</head>
<body>
  <header id="topbar" class="topbar" hidden>
    <div class="topbar-inner">
      <button class="brand" data-action="today" aria-label="오늘 할 일로 이동"><span class="brand-icon">C</span><span>CalendarSync <small>BETA</small></span></button>
      <nav aria-label="주요 메뉴"><button data-action="today" id="nav-today">오늘 할 일</button><button data-action="calendar" id="nav-calendar">캘린더</button></nav>
      <div class="account"><span id="account-name"></span><button class="text-button" data-action="logout">로그아웃</button></div>
    </div>
  </header>
  <main id="app" class="app"><div class="loading" role="status">베타를 불러오는 중이에요…</div></main>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>이 베타를 사용하려면 JavaScript를 켜 주세요.</noscript>
  <footer>CalendarSync · 서울과학고 일정 웹서비스 베타 · Teams 일정은 예시입니다.</footer>
</body>
</html>
